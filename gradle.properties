org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.1
fabric_api_version=0.160.5+26.3

mod_version=0.11.0
maven_group=io.github.andrewwwwwwwwwwwwwww
archives_base_name=shopguard

# The built EconomyCraft jar ShopGuard compiles its claim-pricing calls against, relative to this
# project. It is a COMPILE-time dependency only: at runtime the classes come from the mod on the
# server, and ShopGuard loads fine without it. Refresh libs/ after rebuilding EconomyCraft, and keep
# it in step with economycraft_jar_min_version below.
#
# CI pins the dependency instead of hand-copying it: economycraft_release names a
# TraiNguyenVan/EconomyCraft release tag whose Fabric jar (verified against the release's
# SHA256) CI downloads into libs/; the fetched filename then replaces economycraft_jar for
# that build. Bumping the release pin is a deliberate upgrade. The verify task checks
# that the jar contains the required API classes; it does not enforce
# economycraft_jar_min_version, which stays recorded as the intended minimum.
economycraft_release=v1.10.1
economycraft_jar=libs/economycraft-fabric-1.10.0_26.3.jar
economycraft_jar_min_version=1.10.0
